name: SiteSiren
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SiteSirenFilter:
    type: system-extension
    platform: macOS
    sources:
      - path: SiteSirenFilter
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.SiteSiren.filter
        INFOPLIST_FILE: SiteSirenFilter/Info.plist
        CODE_SIGN_ENTITLEMENTS: SiteSirenFilter/SiteSirenFilter.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    frameworks:
      - framework: NetworkExtension.framework
      - framework: Network.framework

  SiteSiren:
    type: application
    platform: macOS
    sources:
      - path: SiteSiren
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.SiteSiren
        INFOPLIST_FILE: SiteSiren/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SiteSiren/SiteSiren.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    frameworks:
      - framework: NetworkExtension.framework
      - framework: SystemExtensions.framework
      - framework: ServiceManagement.framework
      - framework: AVFoundation.framework
      - framework: AppKit.framework
      - framework: SwiftUI.framework
      - framework: Network.framework

  SiteSirenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SiteSirenTests
    dependencies:
      - target: SiteSiren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.SiteSirenTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SiteSiren.app/Contents/MacOS/SiteSiren
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  SiteSiren:
    build:
      targets:
        SiteSiren: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SiteSirenTests

